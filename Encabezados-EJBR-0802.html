<!DOCTYPE html><!--Indica que se usara html5-->

<head><!--encabezado del html-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Indica que el ancho sea el mismo que el dispositivo -->
    <title>Encabezados HTML</title><!--titulo de la pagina web-->
</head><!--se cierra el encabezado del html-->

<body><!--Cuerpo de html-->
   
    <h1>Titulo 1</h1><!--Titulo de mayor importaancia-->
    <h2>Titulo 2</h2><!--Titulo importante-->
    <h3>Titulo 3</h3><!--Titulo no tan importante-->
    <h4>Titulo 4</h4><!--Titulo aun menos importante-->
    <h5>Titulo 5</h5><!--Titulo sin importancia-->
    <h6>Titulo 6</h6><!--Texto solo resaltado-->
</body><!--Se cierra el cuerpo del html-->

</html><!--Se cierra el html-->
